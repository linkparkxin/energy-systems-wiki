<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-label="Dual source heat pump system boundary">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17324d"/></marker>
    <style>
      .core{fill:#f7f9fb;stroke:#17324d;stroke-width:3}.source-a{fill:#dce9f5;stroke:#2f65b0;stroke-width:3}.source-b{fill:#e8f1ec;stroke:#2e8b68;stroke-width:3}.load{fill:#f8e7d4;stroke:#c7782b;stroke-width:3}.line{fill:none;stroke:#17324d;stroke-width:3;marker-end:url(#arrow)}.label{font-family:'Times New Roman','SimSun','宋体','Songti SC',serif;font-size:25px;fill:#17324d;text-anchor:middle}.minor{font-family:'Times New Roman','SimSun','宋体','Songti SC',serif;font-size:21px;fill:#566274;text-anchor:middle}
    </style>
  </defs>
  <rect width="1060" height="560" fill="#fff"/>
  <rect x="380" y="185" width="300" height="170" rx="16" class="core"/>
  <rect x="70" y="75" width="230" height="95" rx="12" class="source-a"/>
  <rect x="760" y="75" width="230" height="95" rx="12" class="source-b"/>
  <rect x="415" y="430" width="230" height="82" rx="12" class="load"/>
  <path d="M300 125 H380 V220" class="line"/><path d="M760 125 H680 V220" class="line"/><path d="M530 355 V430" class="line"/>
  <text x="185" y="116" class="label">空气侧</text><text x="185" y="148" class="label">Air Source</text>
  <text x="875" y="116" class="label">蒸发冷侧</text><text x="875" y="148" class="label">Evaporative Source</text>
  <text x="530" y="245" class="label">双源冷凝</text><text x="530" y="278" class="label">Dual-source Condenser</text>
  <text x="530" y="315" class="minor">制冷剂回路</text>
  <text x="530" y="466" class="label">末端负荷</text><text x="530" y="497" class="label">Load</text>
</svg>