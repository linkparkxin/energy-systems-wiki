<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">蒸气压缩制冷循环四状态点示意</title>
<desc id="desc">压缩机、冷凝器、膨胀装置和蒸发器组成的四状态点循环示意图。</desc>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315bc7"/></marker>
  <style>
    .title{font:700 25px Arial,'Noto Sans CJK SC',sans-serif;fill:#20242b}
    .label{font:600 18px Arial,'Noto Sans CJK SC',sans-serif;fill:#20242b}
    .small{font:15px Arial,'Noto Sans CJK SC',sans-serif;fill:#5c6675}
    .box{fill:#f7f9fc;stroke:#b8c5dc;stroke-width:2;rx:14}
    .line{stroke:#315bc7;stroke-width:4;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<rect width="1100" height="560" fill="#fff"/>
<text x="55" y="48" class="title">蒸气压缩制冷循环：状态点与部件对应</text>
<text x="55" y="78" class="small">原创通用示意图；状态点编号遵循常见制冷循环表达，具体系统可能包含附加支路。</text>

<rect x="405" y="110" width="250" height="90" class="box"/>
<text x="530" y="148" text-anchor="middle" class="label">压缩机</text>
<text x="530" y="175" text-anchor="middle" class="small">1 → 2：输入压缩功</text>
<rect x="765" y="235" width="250" height="90" class="box"/>
<text x="890" y="273" text-anchor="middle" class="label">冷凝器</text>
<text x="890" y="300" text-anchor="middle" class="small">2 → 3：向环境放热</text>
<rect x="405" y="390" width="250" height="90" class="box"/>
<text x="530" y="428" text-anchor="middle" class="label">膨胀装置</text>
<text x="530" y="455" text-anchor="middle" class="small">3 → 4：降压，近似等焓</text>
<rect x="45" y="235" width="250" height="90" class="box"/>
<text x="170" y="273" text-anchor="middle" class="label">蒸发器</text>
<text x="170" y="300" text-anchor="middle" class="small">4 → 1：从负荷侧吸热</text>

<path d="M655 155 H765 Q805 155 805 235" class="line"/>
<path d="M890 325 Q890 370 655 435" class="line"/>
<path d="M405 435 H295 Q250 435 250 325" class="line"/>
<path d="M295 235 Q295 155 405 155" class="line"/>

<circle cx="350" cy="155" r="21" fill="#315bc7"/><text x="350" y="162" text-anchor="middle" fill="#fff" class="label">1</text>
<circle cx="705" cy="155" r="21" fill="#315bc7"/><text x="705" y="162" text-anchor="middle" fill="#fff" class="label">2</text>
<circle cx="705" cy="435" r="21" fill="#315bc7"/><text x="705" y="442" text-anchor="middle" fill="#fff" class="label">3</text>
<circle cx="350" cy="435" r="21" fill="#315bc7"/><text x="350" y="442" text-anchor="middle" fill="#fff" class="label">4</text>
<text x="55" y="520" class="small">q̇e = ṁr(h1 − h4)，ẇc = ṁr(h2 − h1)，q̇rej = q̇e + ẇc。</text>
</svg>