<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-label="Vapor compression refrigeration cycle">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17324d"/></marker>
    <style>
      .box{fill:#f7f9fb;stroke:#17324d;stroke-width:2.5}.hot{fill:#f8e7d4;stroke:#c7782b;stroke-width:2.5}.cold{fill:#dce9f5;stroke:#2f65b0;stroke-width:2.5}.line{fill:none;stroke:#17324d;stroke-width:3;marker-end:url(#arrow)}.label{font-family:'Times New Roman','SimSun','宋体','Songti SC',serif;font-size:24px;fill:#17324d;text-anchor:middle}.num{font-family:'Times New Roman',Times,serif;font-size:22px;font-weight:bold;fill:#17324d}
    </style>
  </defs>
  <rect width="980" height="560" fill="#fff"/>
  <rect x="360" y="55" width="260" height="82" rx="8" class="box"/>
  <rect x="705" y="230" width="190" height="82" rx="8" class="hot"/>
  <rect x="360" y="420" width="260" height="82" rx="8" class="cold"/>
  <rect x="85" y="230" width="190" height="82" rx="8" class="cold"/>
  <path d="M620 96 H770 V230" class="line"/>
  <path d="M800 312 V461 H620" class="line"/>
  <path d="M360 461 H180 V312" class="line"/>
  <path d="M180 230 V96 H360" class="line"/>
  <text x="490" y="91" class="label">压缩机</text><text x="490" y="121" class="label">Compressor</text>
  <text x="800" y="266" class="label">冷凝器</text><text x="800" y="296" class="label">Condenser</text>
  <text x="490" y="456" class="label">蒸发器</text><text x="490" y="486" class="label">Evaporator</text>
  <text x="180" y="266" class="label">膨胀装置</text><text x="180" y="296" class="label">Expansion Device</text>
  <text x="640" y="82" class="num">1</text><text x="820" y="205" class="num">2</text><text x="640" y="492" class="num">3</text><text x="125" y="205" class="num">4</text>
</svg>